<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET File</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #05080f;
            color: #00ff88;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        /* Hintergrund-Grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(0,255,136,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .terminal {
            width: min(90vw, 700px);
            background: rgba(0, 10, 0, 0.85);
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 30px;
            box-shadow:
                0 0 15px rgba(0,255,136,0.4),
                0 0 40px rgba(0,255,136,0.15);
            backdrop-filter: blur(4px);
        }

        .header {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,255,136,0.3);
            padding-bottom: 15px;
        }

        .title {
            margin: 0;
            font-size: 2rem;
            text-shadow: 0 0 10px #00ff88;
        }

        .subtitle {
            margin-top: 8px;
            color: #8affc1;
            opacity: 0.8;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #8affc1;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            box-shadow:
                0 0 10px rgba(0,255,136,0.7),
                inset 0 0 10px rgba(0,255,136,0.15);
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 20px rgba(0,255,136,0.8);
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #00ff88;
            text-decoration: none;
            opacity: 0.8;
        }

        .back:hover {
            opacity: 1;
            text-shadow: 0 0 8px #00ff88;
        }

        .prompt {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <main class="terminal">
        <div class="header">
            <h1 class="title">[ GET ] FILE RETRIEVAL</h1>
            <div class="subtitle">
                Access remote filesystem resources
            </div>
        </div>

        <form method="GET" action="/get_file">
            <div class="prompt">
                root@webserver:~$ enter target path<span class="cursor">_</span>
            </div>

            <label for="filepath">File Path</label>
            <input
                type="text"
                id="filepath"
                name="filepath"
                placeholder="/var/www/index.html"
                required>

            <button type="submit">
                Execute GET
            </button>
        </form>

        <a class="back" href="index.html">
            ← Return to Main Terminal
        </a>
    </main>
</body>
</html>
